<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Party Pool · DeadRight</title>
<meta name="description" content="Pick your call. No app, no signup.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<style>
  /* System fonts only: guests open this at a party on a phone, often on bad
     wifi, and a webfont round-trip is the slowest thing on the page. */
  :root{
    --bg:#0E121A; --s1:#151B26; --s2:#1C2534; --s3:#243042;
    --border:#283447; --amber:#F7C846; --mint:#8AE98D; --coral:#FC574E;
    --violet:#6C63FF; --flame:#FF5500; --ink:#F0F0F0; --dim:#96A5B9;
    --ink-on-amber:#0E121A;
    --display:'Barlow','Helvetica Neue',Arial,system-ui,sans-serif;
    --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--body);
    min-height:100vh; min-height:100dvh;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:420px}
  .brand{
    font-family:var(--display); font-weight:900; font-size:20px;
    letter-spacing:-.5px; color:var(--flame); margin:0 0 24px;
  }
  h1{
    font-family:var(--display); font-weight:800; font-size:26px; line-height:1.2;
    letter-spacing:-.4px; margin:0 0 8px;
  }
  .sub{color:var(--dim); font-size:14px; margin:0 0 24px}
  .card{
    background:var(--s1); border:1px solid var(--border);
    border-radius:24px; padding:20px;
  }
  fieldset{border:0; margin:0; padding:0}
  legend{
    font-family:var(--display); font-weight:600; font-size:11px;
    letter-spacing:2px; text-transform:uppercase; color:var(--amber);
    padding:0; margin-bottom:12px;
  }
  /* The option is a real radio, visually replaced — so keyboard and screen
     readers get native semantics and grouping for free. */
  .opt{display:block; position:relative; margin-bottom:10px}
  /* Visually hidden, but still a real focusable radio in the accessibility
     tree. opacity:0 with width/height:0 removed it from the a11y tree and from
     hit testing entirely, so the control was unreachable by keyboard and by
     screen reader even though the label looked clickable. */
  .opt input{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%);
    white-space:nowrap; border:0;
  }
  .opt span{
    display:flex; align-items:center; gap:12px;
    background:var(--s2); border:1.5px solid var(--border);
    border-radius:16px; padding:16px; font-size:16px; font-weight:500;
    cursor:pointer; transition:border-color .12s, background .12s;
    min-height:56px;
  }
  .opt span::before{
    content:''; flex:0 0 20px; height:20px; border-radius:50%;
    border:2px solid var(--dim); transition:border-color .12s, box-shadow .12s;
  }
  .opt input:checked + span{border-color:var(--amber); background:var(--s3)}
  .opt input:checked + span::before{
    border-color:var(--amber); box-shadow:inset 0 0 0 5px var(--amber);
  }
  .opt input:focus-visible + span{outline:2px solid var(--amber); outline-offset:2px}
  label.fld{
    display:block; font-family:var(--display); font-weight:600; font-size:11px;
    letter-spacing:2px; text-transform:uppercase; color:var(--amber);
    margin:20px 0 8px;
  }
  input[type=text]{
    width:100%; background:var(--s2); border:1.5px solid var(--border);
    border-radius:16px; padding:16px; color:var(--ink); font-size:16px;
    font-family:var(--body);
  }
  input[type=text]::placeholder{color:var(--dim)}
  input[type=text]:focus{outline:none; border-color:var(--amber)}
  button{
    width:100%; margin-top:20px; min-height:56px;
    background:var(--amber); color:var(--ink-on-amber);
    border:0; border-radius:999px; cursor:pointer;
    font-family:var(--display); font-weight:800; font-size:16px;
    letter-spacing:.3px;
  }
  button:disabled{opacity:.45; cursor:default}
  button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .note{color:var(--dim); font-size:12px; text-align:center; margin:16px 0 0}
  .err{
    color:var(--coral); font-size:14px; margin:16px 0 0; text-align:center;
    font-weight:500;
  }
  /* Results */
  .row{margin-bottom:16px}
  .row-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
  .row-label{font-size:15px; font-weight:600}
  .row-pct{font-family:var(--display); font-weight:800; font-size:15px; color:var(--amber)}
  .row.win .row-pct, .row.win .row-label{color:var(--mint)}
  .track{
    height:8px; background:var(--s3); border-radius:999px;
    margin-top:8px; overflow:hidden;
  }
  .fill{
    height:100%; background:var(--amber); border-radius:999px;
    width:0; transition:width .5s ease;
  }
  .row.win .fill{background:var(--mint)}
  .row-sub{color:var(--dim); font-size:12px; margin-top:6px}
  .tag{
    display:inline-block; background:var(--s3); color:var(--dim);
    border-radius:999px; padding:5px 12px; font-size:11px; font-weight:600;
    letter-spacing:1px; text-transform:uppercase; margin-bottom:16px;
  }
  .tag.open{background:rgba(247,200,70,.15); color:var(--amber)}
  .tag.closed{background:rgba(138,233,141,.15); color:var(--mint)}
  .foot{
    color:var(--dim); font-size:12px; text-align:center; margin:28px 0 0;
    line-height:1.6;
  }
  .foot b{color:var(--flame)}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">DeadRight 🔥</p>

  <div id="loading">
    <h1>Loading the pool…</h1>
  </div>

  <div id="dead" hidden>
    <h1>This pool isn't here</h1>
    <p class="sub">The link may be wrong, or the host deleted it. Ask them for a fresh one.</p>
  </div>

  <!-- Pick -->
  <div id="pick" hidden>
    <h1 id="q"></h1>
    <p class="sub" id="meta"></p>
    <div class="card">
      <form id="form">
        <fieldset>
          <legend>Your call</legend>
          <div id="opts"></div>
        </fieldset>
        <label class="fld" for="name">Your name</label>
        <input type="text" id="name" maxlength="24" placeholder="So they know who called it"
               autocomplete="name" enterkeyhint="done">
        <button type="submit" id="go" disabled>Lock it in</button>
        <p class="err" id="err" hidden></p>
        <p class="note">No app, no signup. One pick per name.</p>
      </form>
    </div>
  </div>

  <!-- Results -->
  <div id="res" hidden>
    <h1 id="q2"></h1>
    <span class="tag" id="status"></span>
    <div class="card"><div id="bars"></div></div>
    <p class="note" id="mine"></p>
  </div>

  <p class="foot">
    Settled on <b>DeadRight</b> — friends call it, the group keeps score.<br>
    No money changes hands. Ever.
  </p>
</div>

<script>
(function () {
  'use strict';
  // The pool edge function is the API. It runs with --no-verify-jwt because
  // guests have no session, and holds the service-role key server-side — so
  // there is nothing secret to put in this page.
  var API = 'https://rpcibnfuhukolgyuqimy.supabase.co/functions/v1/pool';

  var params = new URLSearchParams(location.search);
  // Accept ?t=<token> and a trailing /<token>, so either link shape works.
  var token = params.get('t') || location.pathname.split('/').filter(Boolean).pop();
  if (!token || token === 'pool' || token === 'index.html') return dead();

  var base = API + '/' + encodeURIComponent(token);
  var el = function (id) { return document.getElementById(id); };
  var show = function (id) {
    ['loading', 'dead', 'pick', 'res'].forEach(function (s) {
      el(s).hidden = s !== id;
    });
  };
  function dead() { show('dead'); }

  var pool = null, chosen = null, myName = null, poll = null;

  fetch(base + '/data')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d) {
      pool = d;
      el('q').textContent = d.question;
      el('q2').textContent = d.question;
      el('meta').textContent = d.title || '';
      // A closed pool has nothing to pick, so go straight to the outcome.
      if (d.status !== 'open') return results();
      renderOptions(d.options || []);
      show('pick');
    })
    .catch(dead);

  function renderOptions(options) {
    var box = el('opts');
    box.textContent = '';
    options.forEach(function (o, i) {
      var lab = document.createElement('label');
      lab.className = 'opt';
      var input = document.createElement('input');
      input.type = 'radio';
      input.name = 'option';
      input.value = o.id;
      input.id = 'o' + i;
      var span = document.createElement('span');
      span.textContent = o.label;
      lab.appendChild(input);
      lab.appendChild(span);
      box.appendChild(lab);
      input.addEventListener('change', function () {
        chosen = o.id;
        sync();
      });
    });
  }

  function sync() {
    el('go').disabled = !(chosen && el('name').value.trim().length > 0);
  }
  el('name').addEventListener('input', function () {
    sync();
    el('err').hidden = true;
  });

  el('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (el('go').disabled) return;
    var name = el('name').value.trim();
    el('go').disabled = true;
    el('go').textContent = 'Locking in…';
    el('err').hidden = true;

    fetch(base, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name: name, optionId: chosen })
    })
      .then(function (r) {
        return r.json().then(function (b) { return { ok: r.ok, body: b }; });
      })
      .then(function (r) {
        if (!r.ok) throw new Error(r.body && r.body.error || 'Could not join.');
        myName = name;
        results();
      })
      .catch(function (e) {
        el('err').textContent = e.message;
        el('err').hidden = false;
        el('go').textContent = 'Lock it in';
        sync();
      });
  });

  function results() {
    show('res');
    if (myName) {
      el('mine').textContent = 'You’re in as ' + myName + '. Results update live.';
    } else {
      el('mine').textContent = 'Results update live.';
    }
    draw();
    // Cheap live-ness without a websocket. Stops when the pool settles, and
    // pauses while the tab is hidden so a phone in a pocket isn't polling.
    if (poll) clearInterval(poll);
    poll = setInterval(function () {
      if (!document.hidden) draw();
    }, 5000);
  }

  function draw() {
    fetch(base + '/results')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var open = d.status === 'open';
        var tag = el('status');
        tag.textContent = open ? 'Open — still picking' : 'Settled';
        tag.className = 'tag ' + (open ? 'open' : 'closed');
        if (!open && poll) { clearInterval(poll); poll = null; }

        var bars = el('bars');
        bars.textContent = '';
        (d.results || []).forEach(function (r) {
          var won = !open && pool && pool.winningOption === r.option_id;
          var row = document.createElement('div');
          row.className = 'row' + (won ? ' win' : '');

          var top = document.createElement('div');
          top.className = 'row-top';
          var l = document.createElement('span');
          l.className = 'row-label';
          l.textContent = won ? r.label + ' 🏆' : r.label;
          var p = document.createElement('span');
          p.className = 'row-pct';
          p.textContent = r.pct + '%';
          top.appendChild(l);
          top.appendChild(p);

          var track = document.createElement('div');
          track.className = 'track';
          var fill = document.createElement('div');
          fill.className = 'fill';
          track.appendChild(fill);

          var sub = document.createElement('div');
          sub.className = 'row-sub';
          sub.textContent = r.entries === 1 ? '1 person' : r.entries + ' people';

          row.appendChild(top);
          row.appendChild(track);
          row.appendChild(sub);
          bars.appendChild(row);
          // Set width after insertion so the transition actually runs.
          requestAnimationFrame(function () { fill.style.width = r.pct + '%'; });
        });
      })
      .catch(function () { /* transient: the next tick retries */ });
  }
})();
</script>
</body>
</html>
